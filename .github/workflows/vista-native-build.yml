name: Build Vista Native

on:
  push:
    branches: [vista-tv-deploy]
    paths:
      - 'vista-native/**'
      - '.github/workflows/vista-native-build.yml'
  workflow_dispatch:

jobs:
  windows:
    name: Windows Vista TV
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Create Windows app and installer
        shell: pwsh
        run: |
          flutter config --enable-windows-desktop
          flutter create --platforms=windows --project-name vista_tv --org com.vistatv vista_build
          Copy-Item vista-native\main.dart vista_build\lib\main.dart -Force
          Copy-Item vista-native\pubspec.yaml vista_build\pubspec.yaml -Force
          Set-Location vista_build
          flutter pub get
          $env:CL="/D_SILENCE_EXPERIMENTAL_COROUTINE_DEPRECATION_WARNINGS"
          flutter build windows --release

          $release = (Resolve-Path 'build\windows\x64\runner\Release').Path
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vsPath = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $vsPath) { throw 'Visual Studio C++ toolchain not found' }
          $crt = Get-ChildItem "$vsPath\VC\Redist\MSVC" -Recurse -Filter msvcp140.dll |
            Where-Object { $_.FullName -match '\\x64\\Microsoft\.VC.*\.CRT\\' } |
            Select-Object -First 1
          if (-not $crt) { throw 'x64 Visual C++ redistributable runtime not found' }
          $crtDir = $crt.Directory.FullName
          Copy-Item "$crtDir\*.dll" $release -Force
          Write-Host "Bundled VC++ runtime from $crtDir"

          choco install innosetup -y --no-progress
          New-Item -ItemType Directory -Force installer | Out-Null
          $iss = @"
          [Setup]
          AppId={{8C8DD3E5-9582-4CD0-A83D-B998E31A61DA}
          AppName=Vista TV
          AppVersion=0.1.0
          AppPublisher=Vista TV
          DefaultDirName={localappdata}\Programs\Vista TV
          DefaultGroupName=Vista TV
          UninstallDisplayIcon={app}\vista_tv.exe
          OutputDir=.
          OutputBaseFilename=Vista-TV-Setup
          Compression=lzma2
          SolidCompression=yes
          ArchitecturesAllowed=x64compatible
          ArchitecturesInstallIn64BitMode=x64compatible
          PrivilegesRequired=lowest
          WizardStyle=modern
          DisableProgramGroupPage=yes

          [Files]
          Source: "$release\*"; DestDir: "{app}"; Flags: ignoreversion recursesubdirs createallsubdirs

          [Icons]
          Name: "{autoprograms}\Vista TV"; Filename: "{app}\vista_tv.exe"
          Name: "{autodesktop}\Vista TV"; Filename: "{app}\vista_tv.exe"

          [Run]
          Filename: "{app}\vista_tv.exe"; Description: "Open Vista TV"; Flags: nowait postinstall skipifsilent
          "@
          Set-Content -Path installer\vista.iss -Value $iss -Encoding UTF8
          $iscc = @(
            'C:\Program Files (x86)\Inno Setup 6\ISCC.exe',
            'C:\Program Files\Inno Setup 6\ISCC.exe'
          ) | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $iscc) { throw 'Inno Setup compiler not found' }
          & $iscc installer\vista.iss
          if (-not (Test-Path installer\Vista-TV-Setup.exe)) { throw 'Installer was not created' }

      - uses: actions/upload-artifact@v4
        with:
          name: Vista-TV-Windows-Installer
          path: vista_build/installer/Vista-TV-Setup.exe
          if-no-files-found: error

  android:
    name: Android Vista TV
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Create Android app
        run: |
          flutter create --platforms=android --project-name vista_tv --org com.vistatv vista_build
          cp vista-native/main.dart vista_build/lib/main.dart
          cp vista-native/pubspec.yaml vista_build/pubspec.yaml
          python3 - <<'PY'
          from pathlib import Path
          p=Path('vista_build/android/app/src/main/AndroidManifest.xml')
          s=p.read_text()
          s=s.replace('<application', '<application android:usesCleartextTraffic="true"', 1)
          p.write_text(s)
          PY
          cd vista_build
          flutter pub get
          python3 - <<'PY'
          from pathlib import Path
          roots=list(Path.home().glob('.pub-cache/hosted/pub.dev/flutter_inappwebview_android-*/android/build.gradle'))
          if not roots:
              raise SystemExit('flutter_inappwebview_android build.gradle not found')
          for p in roots:
              s=p.read_text()
              old="getDefaultProguardFile('proguard-android.txt')"
              new="getDefaultProguardFile('proguard-android-optimize.txt')"
              if old in s:
                  p.write_text(s.replace(old,new))
                  print('Patched', p)
          PY
          flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: Vista-TV-Android
          path: vista_build/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
